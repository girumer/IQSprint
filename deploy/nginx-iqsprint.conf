# nginx site for IQsprint
# Copy to /etc/nginx/sites-available/iqsprint, link it into sites-enabled,
# then run: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain-or-ip;   # change this

    # Folder created by "npm run build" in frontend/
    root /var/www/iqsprint/frontend/build;   # change to where you put the build
    index index.html;

    # Compress text files so pages load faster on mobile data
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built JS/CSS/images have unique names, so browsers can cache them for a long time
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API requests go to the Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React routes (/login, /GameTabs, /admin) all load index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
